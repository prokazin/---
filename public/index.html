<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CoinDigest — Крипто-новости и аналитика</title>
    <meta name="description" content="CoinDigest — крипто-новости, цены, портфель и алерты в Telegram Mini App." />
    <meta name="theme-color" content="#0B0E11" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<header class="header">
    <div class="logo">
        <i class="fas fa-coins"></i>
        <span>CoinDigest</span>
    </div>
    <div class="last-update">
        <i class="fas fa-sync-alt"></i>
        <span id="updateTime">—</span>
    </div>
</header>

<main class="main">

    <!-- ГЛАВНАЯ -->
    <section class="page active" id="page-home">
        <div class="card trend-card" id="trendCard"><div class="skeleton-line"></div></div>

        <div class="card" id="whyCard">
            <div class="card-title"><i class="fas fa-fire"></i><span>Почему это важно</span></div>
            <div id="whyContent" class="why-content">
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
            </div>
        </div>

        <div class="quick-actions">
            <button class="quick-btn" data-goto="portfolio"><i class="fas fa-briefcase"></i><span>Портфель</span></button>
            <button class="quick-btn" data-goto="alerts"><i class="fas fa-bell"></i><span>Алерты</span></button>
            <button class="quick-btn" data-goto="news"><i class="fas fa-newspaper"></i><span>Все новости</span></button>
        </div>

        <div class="card">
            <div class="card-title">
                <i class="fas fa-trophy"></i><span>Топ-5 монет</span>
                <button class="link-btn" data-goto="market">Все <i class="fas fa-chevron-right"></i></button>
            </div>
            <div id="topCoins" class="top-coins">
                <div class="skeleton-line"></div><div class="skeleton-line"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <i class="fas fa-calendar-alt"></i><span>События дня</span>
                <button class="link-btn" data-goto="calendar">Все <i class="fas fa-chevron-right"></i></button>
            </div>
            <div id="eventsToday" class="events-today"><div class="skeleton-line"></div></div>
        </div>
    </section>

    <!-- РЫНОК -->
    <section class="page" id="page-market">
        <div class="market-controls">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="marketSearch" placeholder="Поиск монеты..." />
            </div>
            <div class="market-filter" id="marketFilter">
                <button class="filter-btn active" data-limit="100">Топ-100</button>
                <button class="filter-btn" data-limit="500">Топ-500</button>
                <button class="filter-btn" data-limit="all">Все</button>
            </div>
        </div>

        <div class="market-table-wrap">
            <table class="market-table">
                <thead>
                    <tr>
                        <th data-sort="name">Монета</th>
                        <th data-sort="price" class="num">Цена</th>
                        <th data-sort="change24" class="num">24ч</th>
                        <th data-sort="change7" class="num">7д</th>
                        <th data-sort="cap" class="num">Кап.</th>
                        <th data-sort="volume" class="num">Объём</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="marketBody">
                    <tr><td colspan="7" class="loading-cell">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- НОВОСТИ -->
    <section class="page" id="page-news">
        <div class="news-controls">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="newsSearch" placeholder="Поиск по заголовку..." />
            </div>

            <div class="news-filters" id="newsFilters">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="important">🔥 Важное</button>
                <button class="filter-btn" data-filter="saved">⭐ Сохранённые</button>
            </div>

            <div class="news-advanced-filters">
                <select class="filter-select" id="newsSourceFilter">
                    <option value="all">Все источники</option>
                </select>
                <select class="filter-select" id="newsCoinFilter">
                    <option value="all">Все монеты</option>
                </select>
                <select class="filter-select" id="newsCategoryFilter">
                    <option value="all">Все категории</option>
                    <option value="regulation">⚖️ Регуляция</option>
                    <option value="etf">📈 ETF</option>
                    <option value="hack">🔓 Взломы</option>
                    <option value="listing">📋 Листинги</option>
                    <option value="tech">🔬 Технологии</option>
                </select>
                <select class="filter-select" id="newsTimeFilter">
                    <option value="all">За всё время</option>
                    <option value="1h">За час</option>
                    <option value="24h">За 24 часа</option>
                    <option value="7d">За неделю</option>
                </select>
            </div>

            <button class="reset-filters-btn" id="newsResetFilters">
                <i class="fas fa-times"></i> Сбросить фильтры
            </button>
        </div>

        <div id="newsList" class="news-list"></div>

        <div class="load-more-wrap">
            <button id="loadMoreNews" class="load-more-btn">Показать ещё</button>
        </div>
    </section>

    <!-- ПОРТФЕЛЬ -->
    <section class="page" id="page-portfolio">
        <div class="card pf-summary">
            <div class="card-title">
                <i class="fas fa-chart-pie"></i>
                <span>Мой портфель</span>
                <button class="link-btn" id="pfShareBtn" style="margin-left:auto;">
                    <i class="fas fa-share-alt"></i> Поделиться
                </button>
            </div>
            <div class="pf-total" id="portfolioTotal">$0.00</div>
            <div class="pf-stats">
                <div class="pf-stat">
                    <div class="pf-label">PnL</div>
                    <div class="pf-val" id="pfPnl">$0.00</div>
                </div>
                <div class="pf-stat">
                    <div class="pf-label">24ч</div>
                    <div class="pf-val" id="pfChange24">0.00%</div>
                </div>
                <div class="pf-stat">
                    <div class="pf-label">7д</div>
                    <div class="pf-val" id="pfChange7">0.00%</div>
                </div>
            </div>
            <div id="portfolioPie" class="pf-pie"></div>
        </div>

        <button class="primary-btn" id="pfAddBtn">
            <i class="fas fa-plus"></i> Добавить монету
        </button>

        <div id="portfolioList" class="pf-list"></div>
    </section>

    <!-- АЛЕРТЫ -->
    <section class="page" id="page-alerts">
        <button class="primary-btn" id="alertAddBtn">
            <i class="fas fa-plus"></i> Создать алерт
        </button>
        <div id="alertsList" class="alerts-list"></div>
    </section>

    <!-- КАЛЕНДАРЬ -->
    <section class="page" id="page-calendar">
        <div class="calendar-filters" id="calFilters">
            <button class="filter-btn active" data-period="today">Сегодня</button>
            <button class="filter-btn" data-period="week">Неделя</button>
            <button class="filter-btn" data-period="month">Месяц</button>
        </div>

        <select class="filter-select" id="calTypeFilter" style="margin-bottom:12px;">
            <option value="all">Все типы</option>
            <option value="halving">🔻 Халвинги</option>
            <option value="fork">🔧 Форки</option>
            <option value="conference">🎤 Конференции</option>
            <option value="listing">📋 Листинги</option>
            <option value="regulation">⚖️ Регуляция</option>
            <option value="update">⚙️ Обновления</option>
            <option value="other">📅 Другое</option>
        </select>

        <div id="calendarList" class="calendar-list">
            <div class="skeleton-line"></div><div class="skeleton-line"></div>
        </div>
    </section>

</main>

<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modalContent"></div>
</div>

<nav class="bottom-nav">
    <button class="nav-btn active" data-page="home"><i class="fas fa-home"></i><span>Главная</span></button>
    <button class="nav-btn" data-page="market"><i class="fas fa-chart-line"></i><span>Рынок</span></button>
    <button class="nav-btn" data-page="news"><i class="fas fa-newspaper"></i><span>Новости</span></button>
    <button class="nav-btn" data-page="portfolio"><i class="fas fa-briefcase"></i><span>Портфель</span></button>
    <button class="nav-btn" data-page="alerts"><i class="fas fa-bell"></i><span>Алерты</span></button>
    <button class="nav-btn" data-page="calendar"><i class="fas fa-calendar-alt"></i><span>Календарь</span></button>
</nav>

<script src="script.js"></script>
</body>
</html>
